<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta tags for search engine -->
    <meta name="description" content="Love Running. Club for runners in Dublin, Ireland. Urban running, trail running. Dublin docklands, and Phoenix Park">
    <meta name="keywords" content="love running, run, running club, runners, Ireland, Dublin, sport, exercise"
    <!-- Title -->
    <title>Love Running</title>
    <!-- FavIcon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/css/style.css">
     
</head>
<body>
    <!-- Header -->
    <div class="header">
        <a href="index.html">
            <h1 id="logo">Love Running</h1>
        </a>
        <!-- Menu toggle button -->
        <input type="checkbox" name="nav-toggle" id="nav-toggle">
        <label for="nav-toggle" class="nav-toggle-label">
            <i class="fa-solid fa-bars"></i>
        </label>
        <!-- Navbar -->
        <nav>
            <ul id="menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="signup.html" class="active">Sign Up</a></li>
            </ul>
        </nav>    
    </div>

    <!-- Main content -->
    <div class="main-content">
        <section id="signup">
            <form action="https://formdump.codeinstitute.net" method="POST" id="signup-form" >
                <h2><i class="fa-solid fa-heart-pulse"></i> Let's Get You Signed Up!</h2>
                <!-- Form inputs -->
                <label for="first-name">First Name</label>
                <input type="text" id="first-name" class="text-input" required>
                <br>
                <label for="last-name">Last Name</label>
                <input type="text" id="last-name" class="text-input" required>
                <br>
                <label for="email-address">Email Address</label>
                <input type="text" id="email-address" class="text-input" required>
                <br>
                <!-- Radio buttons -->
                <div class="radio-buttons">
                    <label for="road">Road</label>
                    <input type="radio" name="running_preference" id="road">
                    <br>
                    <label for="trail">Trail</label>
                    <input type="radio" name="running_preference" id="trail">
                    <br>
                    <label for="both">Both</label>
                    <input type="radio" name="running_preference" id="both">
                    <br>
                </div>
                <!-- Submit -->
                <button type="submit" class="join-button">Let's Run!</button>
            </form>
        </section>
    </div>

    <!-- Footer -->
    <div class="footer">
        <ul id="social-networks">
            <li><a href="http://www.facebook.com" target="_blank" rel="noopener"
                    aria-label="Visit our Facebook page (opens in new tab)">
                    <i class="fa-brands fa-facebook"></i></a>
            </li>
            <li><a href="http://www.instagram.com" target="_blank" rel="noopener"
                    aria-label="Visit our Instagram page (opens in new tab)">
                    <i class="fa-brands fa-square-instagram"></i></a>
            </li>
            <li><a href="http://www.YouTube.com" target="_blank" rel="noopener"
                    aria-label="Visit our YouTube page (opens in new tab)">
                    <i class="fa-brands fa-youtube"></i></a>
            </li>
            <li><a href="http://www.X.com" target="_blank" rel="noopener" aria-label="Visit our X page (opens in new tab)">
                    <i class="fa-brands fa-x-twitter"></i></a>
            </li>
        </ul>
    </div>

    <!-- Font awesome kit script -->
    <script src="https://kit.fontawesome.com/68e4433a11.js" crossorigin="anonymous"></script>

</body>
</html>
